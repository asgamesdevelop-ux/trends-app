name: Ежедневный сбор топов

on:
  schedule:
    - cron: '35 6 * * *'   # 09:35 по Турции (UTC+3)
  workflow_dispatch:        # ручной запуск кнопкой «Run workflow»

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Установка зависимостей
        working-directory: collector
        run: npm ci

      - name: Сбор топов Google Play
        working-directory: collector
        run: node collector.mjs ../data

      - name: Сводка в Telegram
        working-directory: collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node notify.mjs ../data

      - name: Сохранение данных
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Данные за $(TZ=Europe/Istanbul date +%F)"
          git push
